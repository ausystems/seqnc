<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Estimator - Inbound Demo</title>
  <meta name="description" content="Try the HVAC inbound estimator: pick an issue, get a slot and a ballpark price, then see what the business owner sees on their end." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
<meta property="og:image" content="https://seqnc.ca/og.jpg"><meta name="twitter:image" content="https://seqnc.ca/og.jpg">  <link rel="stylesheet" href="/demo/seqnc-frame.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div class="seqnc-frame" role="banner">
    <a class="seqnc-frame__brand" href="/" aria-label="Seqnc Automations, home">
      <svg viewBox="8 4 104 112" aria-hidden="true"><defs><radialGradient id="sqg" cx=".34" cy=".28" r=".82"><stop offset="0" stop-color="#CFA6F5"/><stop offset=".5" stop-color="#C594F2"/><stop offset="1" stop-color="#7C42B4"/></radialGradient></defs><path d="M60 16 98 38v44L60 104 22 82V38Z" fill="none" stroke="#A861E6" stroke-width="5" stroke-linejoin="round"/><path d="M60 60V16M60 60l38-22M60 60l38 22M60 60v44M60 60 22 82M60 60 22 38" stroke="#7C42B4" stroke-width="4.5" stroke-linecap="round"/><g fill="url(#sqg)"><circle cx="60" cy="16" r="9"/><circle cx="98" cy="38" r="9"/><circle cx="98" cy="82" r="9"/><circle cx="60" cy="104" r="9"/><circle cx="22" cy="82" r="9"/><circle cx="22" cy="38" r="9"/><circle cx="60" cy="60" r="13"/></g><circle cx="60" cy="60" r="3.6" fill="#fff" opacity=".92"/></svg>
      <span>Seqnc</span>
    </a>
    <span class="seqnc-frame__tag">Live demo · Inbound</span>
    <span class="seqnc-frame__note">Sample data. Nothing is sent, stored or charged.</span>
    <a class="seqnc-frame__back" href="/#demos"><svg viewBox="0 0 15 10" aria-hidden="true"><path d="M15 5H1.6M5.8 .8 1.4 5l4.4 4.2" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back to Seqnc</span></a>
  </div>
  <header class="site-header">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2" />
      <path d="M16 9v7l5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div>
      <div class="brand-row">
        <span class="brand" id="brand-name">Demo HVAC Co.</span>
        <span class="demo-pill">Demo</span>
      </div>
      <div class="brand-sub">Interactive preview - nothing here is a real booking, message, or charge.</div>
    </div>
    <a class="back-link" href="/#demos">Back to Seqnc</a>
  </header>

  <nav class="view-tabs" role="tablist" aria-label="Demo view">
    <button class="view-tab" id="tab-customer" type="button" role="tab" aria-selected="true">Customer Booking Flow</button>
    <button class="view-tab" id="tab-admin" type="button" role="tab" aria-selected="false">Business Owner Dashboard</button>
  </nav>

  <main class="app-shell" id="customer-view">
    <div class="progress" id="progress"></div>
    <div class="card" id="step-container"></div>
  </main>

  <main class="admin-shell" id="admin-view" hidden>
    <div class="summary-row" id="summary-row"></div>
    <h2 class="section-title">Today's Emergency Slots</h2>
    <div id="slots-panel"></div>
    <h2 class="section-title">Job Tickets</h2>
    <div id="bookings-panel"></div>
  </main>

  <footer class="demo-footer">
    <button class="btn btn-secondary" id="restart-demo" type="button">Restart demo</button>
  </footer>

  <script src="demo-data.js"></script>
  <script src="demo.js"></script>
</body>
</html>
